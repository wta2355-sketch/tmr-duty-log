<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>소급 등록 · TMR 당직일지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
:root{--bg:#f4f5f1;--card:#fff;--ink:#1d241f;--muted:#5f6b63;--line:#d5dad3;--accent:#2f5d46;--accent-ink:#fff;--ok:#2f7a4f;--warn:#a5521c;
  --f:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#161a17;--card:#1f2521;--ink:#e6ebe6;--muted:#9aa69e;--line:#36403a;--accent:#6fae8b;--accent-ink:#0f1511;--ok:#7cc79a;--warn:#e19a62;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5}
main{max-width:720px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
label{font-weight:600;font-size:14px}
input[type=password]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px}
.st-ok{color:var(--ok);font-weight:600}.st-warn{color:var(--warn);font-weight:600}.st-mute{color:var(--muted)}
.msg{font-size:14px;min-height:1.4em}.msg.err{color:var(--warn)}.msg.ok{color:var(--ok)}
</style>
</head>
<body>
<main>
  <header>
    <h1>경비당번·CCTV 일지 소급 등록</h1>
    <div class="sub">이미 작성된 당직일지에 경비당번 근무일지·CCTV 점검일지 내용을 한꺼번에 넣습니다. 당직일지 본문과 근무자 서명은 바뀌지 않습니다.</div>
  </header>

  <section class="card" id="loginCard">
    <label for="pw">근무자 계정 비밀번호</label>
    <input type="password" id="pw" autocomplete="current-password">
    <button class="btn primary" id="loginBtn" type="button">근무자로 로그인</button>
    <div class="msg" id="loginMsg"></div>
  </section>

  <section class="card" id="mainCard" hidden>
    <label for="file">소급 등록 파일 (.json)</label>
    <input type="file" id="file" accept=".json,application/json">
    <div class="tw"><table id="tbl" hidden><thead><tr><th>날짜</th><th>당직자</th><th>세트 / 해제</th><th>CCTV 점검자</th><th>상태</th></tr></thead><tbody></tbody></table></div>
    <div class="row" id="actions" hidden>
      <button class="btn primary" id="goBtn" type="button">등록 가능한 날짜 등록</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="sub">결재된 날짜는 잠겨 있어 등록되지 않습니다. 공장장·본부장이 당직일지에서 그 날짜 결재를 취소하면 이 화면에서 다시 확인해 등록할 수 있습니다. 등록 후 다시 결재하면 됩니다.</div>
  </section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCUo98hBrMdV-Cv2k-w5K-d9rY01qdmkuU",authDomain:"tmr-duty-log.firebaseapp.com",databaseURL:"https://tmr-duty-log-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"tmr-duty-log",storageBucket:"tmr-duty-log.firebasestorage.app",messagingSenderId:"648207468713",appId:"1:648207468713:web:86ea42b7da66d90dc581b8"};
const WORKER="duty@gjtmr.local";
const $=id=>document.getElementById(id);
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.database();
let data=null,status={};

$("loginBtn").addEventListener("click",async()=>{
  $("loginMsg").className="msg";$("loginMsg").textContent="로그인 중…";
  try{if(auth.currentUser&&auth.currentUser.email!==WORKER)await auth.signOut();await auth.signInWithEmailAndPassword(WORKER,$("pw").value)}
  catch(e){$("loginMsg").className="msg err";$("loginMsg").textContent="비밀번호가 맞지 않습니다."}
});
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginBtn").click()});
auth.onAuthStateChanged(u=>{const on=u&&u.email===WORKER;$("loginCard").hidden=!!on;$("mainCard").hidden=!on;
  if(u&&!on){$("loginMsg").className="msg";$("loginMsg").textContent="지금은 근무자가 아닌 계정으로 로그인되어 있습니다. 근무자 비밀번호로 다시 로그인하세요."}});

$("file").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());if(j.kind!=="tmr-duty-backfill"||!j.dates)throw 0;data=j.dates}
  catch(_){$("msg").className="msg err";$("msg").textContent="소급 등록용 파일이 아닙니다.";return}
  await check();
});
const hm=v=>v?v.slice(5).replace("-","/").replace("T"," "):"–";
async function check(){
  const tb=$("tbl").querySelector("tbody");tb.textContent="";status={};
  for(const [d,x] of Object.entries(data)){
    let st,cls;
    try{
      const s=(await db.ref("dutyLogs/"+d).get()).val()||{};
      if(!s.log){st="당직일지 없음";cls="st-mute"}
      else if(s.review?.manager||s.review?.director){st="결재됨 (결재 취소 필요)";cls="st-warn"}
      else if(s.log.worker!==x.worker){st=`당직자 다름 (${s.log.worker||"없음"})`;cls="st-warn"}
      else if(s.log.guard||s.log.cctv){st="이미 입력됨";cls="st-mute"}
      else{st="등록 가능";cls="st-ok";status[d]=true}
    }catch(e){st="확인 실패";cls="st-warn"}
    const tr=document.createElement("tr");
    [d,x.worker,`${hm(x.guard.set)} / ${hm(x.guard.unset)}`,x.cctv.who||x.worker,st].forEach((v,i)=>{const td=document.createElement("td");td.textContent=v;if(i===4)td.className=cls;tr.appendChild(td)});
    tb.appendChild(tr);
  }
  $("tbl").hidden=false;$("actions").hidden=false;
  const n=Object.keys(status).length;$("goBtn").disabled=!n;$("goBtn").textContent=n?`${n}일 등록`:"등록 가능한 날짜 없음";
  $("msg").className="msg";$("msg").textContent="";
}
$("goBtn").addEventListener("click",async()=>{
  $("goBtn").disabled=true;let ok=0,fail=[];
  for(const d of Object.keys(status)){
    const x=data[d];
    try{await db.ref(`dutyLogs/${d}/log`).update({guard:x.guard,cctv:x.cctv,updatedAt:new Date().toISOString()});ok++}
    catch(e){fail.push(d)}
  }
  await check();
  $("msg").className=fail.length?"msg err":"msg ok";
  $("msg").textContent=`${ok}일 등록했습니다.`+(fail.length?` 실패: ${fail.join(", ")}`:"");
});
</script>
</body>
</html>
